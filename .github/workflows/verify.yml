name: Sacred Separation Verification
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify L0 ∩ L2 = ∅
        run: |
          echo "Checking L0 import in L2..."
         ! grep -r "from L0_quran_source import" L2_engine/ || (echo "FAIL L0∩L2" && exit 1)
          echo "OK L0 ∩ L2 = ∅"
      - name: Verify L0 Integrity
        run: |
          python3 -c "import json; m=json.load(open('L0_quran_source/manifest.json')); assert not m['integrity']['is_executable']; print('OK L0 integrity')"
      - name: Run Engine
        run: |
          python3 L2_engine/core.py
          python3 L2_engine/israf_experiment.py
      - name: Check Dashboard
        run: |
          ls reports/V8_REAL_Dashboard.html
          echo "OK Dashboard V8 REAL"
