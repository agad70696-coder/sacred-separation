name: Sacred Separation V8 REAL
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify L0 ∩ L2 = ∅
        run: |
          echo "== Running verify_local.py =="
          python verify_local.py
          echo "== Checking no direct import =="
          if grep -R "L0_quran_source" L2_engine --include="*.py" | grep -E "import|from" | grep -v "manifest.json"; then
            echo "FAIL: L2 imports L0 directly!"
            exit 1
          fi
          echo "== Running L2 engine =="
          python L2_engine/*.py
          echo "✅ V8 REAL VERIFIED - L0 ∩ L2 = ∅"
