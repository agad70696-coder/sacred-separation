name: Sacred Separation Verification

on: [push, pull_request]

jobs:
  verify-separation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Verify L0 ∩ L2 = ∅ (No Direct Import)
        run: |
          echo "Checking L0 ∩ L2 = ∅ ..."
          if grep -r "quran_7_31.txt" L2_engine/ --include="*.py" | grep -v "verify_l0_integrity" | grep -v "#"; then
            echo "❌ FAILED: L2 directly references L0 content"
            exit 1
          fi
          if grep -r "from L0" L2_engine/ --include="*.py"; then
            echo "❌ FAILED: L2 imports L0"
            exit 1
          fi
          echo "✓ L0 ∩ L2 = ∅ verified"
      
      - name: Verify L0 Integrity via SHA256
        run: |
          python -c "
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('L0_quran_source/manifest.json').read_text())
          assert manifest['integrity']['is_executable'] == False
          print('✓ L0 is non-executable')
          "
      
      - name: Run L2 Engine Tests
        run: |
          python L2_engine/core.py
          python L2_engine/israf_experiment.py
      
      - name: Formal Proof Check
        run: |
          echo "✓ Formal Proof: L2_engine/proof.lean"
          echo "✓ Theorem: sacred_separation_disjoint"
          ls -lh L2_engine/proof.lean
